:root{--ink:#0c0806;--stone:#2b2119;--stone2:#231a13;--hi:#6e553a;--lo:#0f0a07;--gold:#e8c060;--text:#e8d8b0;--dim:#9a8460;--px:"Delve",monospace;--vt:"Delve",monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--text);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;font-family:var(--vt);-webkit-font-smoothing:none;font-smooth:never}
img,canvas{image-rendering:pixelated;image-rendering:crisp-edges}
.panel{background-color:var(--stone);background-image:repeating-conic-gradient(var(--stone) 0 25%,var(--stone2) 0 50%);background-size:4px 4px;box-shadow:inset 2px 2px 0 var(--hi),inset -2px -2px 0 var(--lo);border:2px solid var(--ink)}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:#000}
#side{display:contents}
#view{position:relative;flex:12 1 auto;max-height:138vw;min-height:0;touch-action:none;overflow:hidden;background:#000;border:3px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;left:8px;top:8px;width:46%;max-width:190px;pointer-events:none;font-family:var(--px);font-size:10px;line-height:1.3;text-shadow:1px 1px 0 #000}
.row{display:flex;justify-content:space-between}
.row b{color:var(--gold);font-weight:normal}
.bar{height:12px;background:#1a0c08;border:2px solid #000;margin:3px 0 5px;position:relative}
.bar>i{position:absolute;left:0;top:0;bottom:0;width:100%;background:#c8382a;box-shadow:inset 0 2px 0 #f06a50,inset 0 -2px 0 #801c14}
#xpbar{height:7px}#xpbar>i{background:#d8a830;box-shadow:inset 0 1px 0 #f8d870}
#mapwrap{position:absolute;right:8px;top:8px;text-align:center;font-family:var(--px);font-size:10px;color:var(--gold);text-shadow:1px 1px 0 #000}
#mini{width:90px;height:90px;display:block;border:2px solid #000;outline:2px solid var(--hi);background:#000;margin:2px 2px 6px}
#sneakbtn{position:absolute;left:8px;bottom:8px;width:62px;height:46px;font-size:10px;gap:4px;opacity:.9}
#sneakbtn.act{background:#1a2a48;box-shadow:inset 2px 2px 0 #0a1020,inset -2px -2px 0 #4a6aa8;color:#9cc4f0}
#bossbar{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;width:76%;display:none;text-align:center;font-family:var(--px);font-size:10px;color:#e8b8ff;text-shadow:2px 2px 0 #000;pointer-events:none}
#bossbar .bar>i{background:#8a2ac8;box-shadow:inset 0 2px 0 #c070f0,inset 0 -2px 0 #4a0c70}
#log{flex:1 1 0;min-height:5.3em;padding:4px 10px;font-size:20px;line-height:1em;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;position:relative}
#log .sp{height:100%}
#logjump{position:sticky;bottom:0;float:right;font-size:10px;padding:6px 8px;display:none;touch-action:manipulation}
#log div{opacity:.6}
#log div.turnsep{opacity:1;height:0;border-top:1px dashed rgba(232,216,176,.12);margin:2px 0}
#log div.new{opacity:1}
.bad{color:#ff8a70}.good{color:#9ee080}.gold{color:var(--gold)}.info{color:#9cc4f0}.boss{color:#d898ff}
#controls{display:flex;gap:8px;padding:8px 8px 10px;touch-action:none;justify-content:center;border-top:none}
.pad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,58px);gap:5px;flex:none}
.acts{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,58px);gap:5px;flex:1;max-width:186px}
button.cst{background:#2c2050;box-shadow:inset 2px 2px 0 #6a50a8,inset -2px -2px 0 #140c28}
button.cst.on{box-shadow:inset 2px 2px 0 #140c28,inset -2px -2px 0 #6a50a8}
.skl{padding:6px 0 2px;text-align:left}.skh{display:flex;justify-content:space-between;font-size:20px}
.sbar{height:6px;background:#1a120c;border:2px solid #000;margin-top:3px}.sbar>i{display:block;height:100%;background:#5a8ad0}
.prk{text-align:left;font-size:20px;padding:2px 0 6px}.prkl{padding-left:12px}
#mpbar{height:7px}#mpbar>i{background:#3a6ad8;box-shadow:inset 0 2px 0 #7aa0f0}
button{font-family:var(--px);font-size:10px;color:var(--text);background:#3a2c20;border:2px solid #000;box-shadow:inset 2px 2px 0 #7a5e40,inset -2px -2px 0 #1a120c;border-radius:0;padding:0;touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;position:relative;text-shadow:1px 1px 0 #000}
button.on{box-shadow:inset 2px 2px 0 #1a120c,inset -2px -2px 0 #7a5e40;background:#2e2219}
button.on img{transform:translate(1px,1px)}
button.atk{background:#5a2018;box-shadow:inset 2px 2px 0 #a04030,inset -2px -2px 0 #2a0c08}
button.atk.on{box-shadow:inset 2px 2px 0 #2a0c08,inset -2px -2px 0 #a04030}
.badge{position:absolute;top:5px;right:5px;color:var(--gold);font-size:10px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.86);display:none;align-items:center;justify-content:center;z-index:10;padding:calc(12px + env(safe-area-inset-top)) 10px calc(12px + env(safe-area-inset-bottom));touch-action:manipulation}
.ov.show{display:flex}
.box{width:100%;max-width:410px;max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px;text-align:center}
.box h1{font-family:var(--px);font-size:30px;color:var(--gold);margin:6px 0 12px;text-shadow:3px 3px 0 #000;letter-spacing:1px}
.box h2{font-family:var(--px);font-size:20px;color:var(--gold);margin:4px 0 10px;text-shadow:2px 2px 0 #000}
.box h3{font-family:var(--px);font-size:10px;color:var(--gold);margin:16px 0 4px;text-align:left;text-shadow:2px 2px 0 #000}
.box p{font-size:20px;line-height:1em;margin:8px 0}
.dim{color:var(--dim)}
.box button.wide{width:100%;font-size:10px;padding:15px 6px;margin:7px 0 0;flex-direction:row;touch-action:manipulation}
.box button.gold,.line button.gold{background:#5a4418;box-shadow:inset 2px 2px 0 #a8843c,inset -2px -2px 0 #2a1e08;color:#ffe8a8}
.line{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:2px solid rgba(0,0,0,.45);text-align:left;font-size:20px;line-height:1em}
.line .t{flex:1}
.line small{color:var(--dim);font-size:20px}
.line img{width:36px;height:36px;flex:none}
.line img.gi{background:#16100b;padding:2px;box-sizing:content-box;border:2px solid #0a0705}
.line img.r1{border-color:#5a8ad0}.line img.r2{border-color:#e8c060}
.line button{font-size:10px;padding:8px 6px;flex-direction:column;gap:5px;touch-action:manipulation;min-width:66px}
.line button:disabled{opacity:.35}
.coin{color:var(--gold)}
#bigmap{width:min(88vw,60vh,396px);height:min(88vw,60vh,396px);border:2px solid #000;outline:2px solid var(--hi);background:#000}
body.wide #app{flex-direction:row}
body.wide #view{flex:1 1 auto;max-height:none}
body.wide #side{width:380px;display:flex;flex-direction:column;justify-content:flex-end;flex:none}
#side,#hud,#mapwrap,#sneakbtn,#bossbar,.ov .box{zoom:var(--ui,1)}
.ov .box{max-height:calc((100vh - 24px) / var(--ui,1))}
#menuov{z-index:20}
.opt{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:2px solid rgba(0,0,0,.45);text-align:left;font-size:20px;line-height:1em}
.opt .t{flex:1}
.opt small{display:block;color:var(--dim);font-size:16px}
.opt button{min-width:112px;font-size:10px;padding:12px 6px;flex-direction:row;touch-action:manipulation}
.opt input[type=range]{flex:none;width:150px;height:28px;accent-color:#d8a830;touch-action:manipulation}
.opt .v{width:44px;text-align:right;color:var(--gold);font-family:var(--px);font-size:10px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;text-align:left;font-size:20px;line-height:1em}
.keys b{font-family:var(--px);font-size:10px;color:var(--gold);font-weight:normal;padding-top:4px}
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <canvas id="cv"></canvas>
    <div id="hud">
      <div class="row"><span id="lvl">LV 1</span><span id="hptxt">30/30</span></div>
      <div class="bar"><i id="hpfill"></i></div>
      <div class="bar" id="mpbar"><i id="mpfill"></i></div>
      <div class="bar" id="xpbar"><i id="xpfill"></i></div>

function rng(seed){return()=>{seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function brickTex(seed,moss,crack){

  for(let y=0;y<32;y++)for(let x=0;x<32;x++){
    const row=y>>3,by=y&7,off=(row&1)?8:0,bx=(x+off)&15,bi=(row*2+(((x+off)>>4)&1))&7;
    let r=116,g=100,b=84,s=sh[bi];

    else{if(by===0||bx===0)s*=1.2;else if(by===6||bx===14)s*=.76;
      const n=R();if(n<.12)s*=.84;else if(n>.94)s*=1.12;
      if(moss&&by>2&&R()<.3){r=64;g=96;b=42}}

try{const old=localStorage.getItem('deepdelve_v2');if(old&&!localStorage.getItem(slotKey(0))){localStorage.setItem(slotKey(0),old);localStorage.removeItem('deepdelve_v2')}}catch(e){}
function save(){if(!H)return;try{localStorage.setItem(slotKey(curSlot),JSON.stringify({H,G:G&&!G.dead?{...G,
  mons:G.mons.map(({t,x,y,hp,maxhp,awake,lv,boss,hx,hy,st,f,lost,sleep})=>({t,x,y,hp,maxhp,awake,lv,boss,hx,hy,st,f,lost,sleep})),msgs:G.msgs.slice(-60)}:null}))}catch(e){}}
function load(i=curSlot){try{const s=JSON.parse(localStorage.getItem(slotKey(i)));if(s&&s.H){if(!s.H.name)s.H.name=HERO_NAMES[i];return s}}catch(e){}return null}

function bfs(map,sx,sy,ok){
  const d=new Int16Array(MW*MH).fill(-1),q=[sx,sy];d[idx(sx,sy)]=0;let h=0;
  while(h<q.length){const x=q[h++],y=q[h++],c=d[idx(x,y)];
    for(let k=0;k<4;k++){const nx=x+DX[k],ny=y+DY[k];if(nx<0||ny<0||nx>=MW||ny>=MH)continue;
      const i=idx(nx,ny);if(d[i]>=0||!ok(map[i]))continue;d[i]=c+1;q.push(nx,ny)}}
  return d;
}

// ================= GENERATION =================
function genFloor(depth,xChests=0){
  let map,rooms;
  do{
    map=new Array(MW*MH).fill(WALL);rooms=[];
    for(let t=0;t<500&&rooms.length<12;t++){
      const w=ri(3,7),h=ri(3,6),x=ri(1,MW-w-1),y=ri(1,MH-h-1);
      if(rooms.some(r=>x<r.x+r.w+1&&x+w+1>r.x&&y<r.y+r.h+1&&y+h+1>r.y))continue;
      rooms.push({x,y,w,h,cx:x+(w>>1),cy:y+(h>>1)});
    }
  }while(rooms.length<5);
  for(const r of rooms)for(let j=r.y;j<r.y+r.h;j++)for(let i=r.x;i<r.x+r.w;i++)map[idx(i,j)]=FLOOR;
  const carve=(x,y)=>{if(x>0&&y>0&&x<MW-1&&y<MH-1)map[idx(x,y)]=FLOOR};
  const corridor=(a,b)=>{let x=a.cx,y=a.cy;
    const sx=()=>{while(x!==b.cx){x+=Math.sign(b.cx-x);carve(x,y)}},sy=()=>{while(y!==b.cy){y+=Math.sign(b.cy-y);carve(x,y)}};
    if(Math.random()<.5){sx();sy()}else{sy();sx()}};
  const order=[rooms[0]],rest=rooms.slice(1);
  while(rest.length){const l=order[order.length-1];let bi=0,bd=1e9;
    rest.forEach((r,i)=>{const d=Math.abs(r.cx-l.cx)+Math.abs(r.cy-l.cy);if(d<bd){bd=d;bi=i}});order.push(rest.splice(bi,1)[0])}
  for(let i=1;i<order.length;i++)corridor(order[i-1],order[i]);
  for(let k=0;k<3;k++)corridor(pick(rooms),pick(rooms));
  const inRoom=(x,y)=>rooms.some(r=>x>=r.x&&x<r.x+r.w&&y>=r.y&&y<r.y+r.h);
  const tryDoor=(x,y)=>{if(map[idx(x,y)]!==FLOOR||inRoom(x,y))return;const w=(i,j)=>map[idx(i,j)]===WALL;
    if(((w(x,y-1)&&w(x,y+1)&&!w(x-1,y)&&!w(x+1,y))||(w(x-1,y)&&w(x+1,y)&&!w(x,y-1)&&!w(x,y+1)))&&Math.random()<.45)map[idx(x,y)]=DOOR};
  for(const r of rooms){for(let i=r.x-1;i<=r.x+r.w;i++){tryDoor(i,r.y-1);tryDoor(i,r.y+r.h)}
    for(let j=r.y;j<r.y+r.h;j++){tryDoor(r.x-1,j);tryDoor(r.x+r.w,j)}}
  const s=rooms[0],dist=bfs(map,s.cx,s.cy,t=>t!==WALL);
  let far=rooms[1],fd=-1;for(const r of rooms.slice(1)){const d=dist[idx(r.cx,r.cy)];if(d>fd){fd=d;far=r}}
  map[idx(far.cx,far.cy)]=STAIRS;
  let dir=0,best=-1;
  for(let k=0;k<4;k++){let n=0,x=s.cx,y=s.cy;while(map[idx(x+DX[k],y+DY[k])]!==WALL){x+=DX[k];y+=DY[k];n++}if(n>best){best=n;dir=k}}
  const free=[];
  for(let y=1;y<MH-1;y++)for(let x=1;x<MW-1;x++)if(map[idx(x,y)]===FLOOR&&dist[idx(x,y)]>5&&Math.abs(x-far.cx)+Math.abs(y-far.cy)>1)free.push([x,y]);
  for(let i=free.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[free[i],free[j]]=[free[j],free[i]]}
  const mons=[],items=[];
  const cands=MONS.map((m,i)=>({m,i})).filter(o=>depth>=o.m.min&&depth<=o.m.max);
  const nM=Math.min(BAL.nMmax,Math.round(BAL.nM0+depth*BAL.nMd));
  for(let k=0;k<nM&&free.length;k++){
    const tot=cands.reduce((a,o)=>a+o.m.w,0);let r=Math.random()*tot,c=cands[0];
    for(const o of cands){r-=o.m.w;if(r<=0){c=o;break}}
    const [x,y]=free.pop(),lv=Math.max(0,depth-c.m.min),deep=Math.max(0,depth-BAL.deepStart),hp=Math.round(c.m.hp*(1+BAL.mhp*lv)*(1+BAL.deepHp*deep));
    mons.push({t:c.i,x,y,hp,maxhp:hp,awake:false,lv,f:ri(0,3),hx:x,hy:y,sleep:Math.random()<.25?1:0});
  }
  // the guardian
  const top=cands.slice().sort((a,b)=>b.m.min-a.m.min).slice(0,2),bt=pick(top);
  const blv=Math.max(0,depth-bt.m.min),bhp=Math.round(bt.m.hp*(1+BAL.mhp*blv)*BAL.bossHP*(1+BAL.deepHp*Math.max(0,depth-BAL.deepStart)));
  mons.push({t:bt.i,x:far.cx,y:far.cy,hp:bhp,maxhp:bhp,awake:false,lv:blv,boss:1,hx:far.cx,hy:far.cy,f:ri(0,3)});
  for(let k=0;k<xChests&&free.length;k++){const [x,y]=free.pop();items.push({k:'chest',x,y})}
  const nI=6+ri(0,3);
  for(let k=0;k<nI&&free.length;k++){const [x,y]=free.pop(),r=k===0?0:Math.random();
    if(r<.3)items.push({k:'potion',x,y});
    else if(r<.66)items.push({k:'gold',v:Math.round(ri(3,7)*Math.pow(depth,BAL.goldExp))+ri(1,5),x,y});
    else if(r<.85)items.push({k:'chest',x,y});
    else items.push({k:'gear',g:rollGear(depth),x,y});
  }
  return{map,mons,items,x:s.cx,y:s.cy,dir};
}

// ================= FLOW =================
function startRun(depth){
  H.runs++;const buff=H.buff||null;H.buff=null;
  G={depth,turn:0,msgs:[],map:[],seen:[],mons:[],items:[],dead:false,sealed:true,kills:0,startDepth:depth,
     P:{x:0,y:0,dir:0,turns:0,hp:maxHP(),mp:maxMP(),gold:0,ward:0,regen:0,sw:0,sneak:false}};
  for(const g of[H.weapon,...H.bag])if(g&&g.maxAmmo)g.ammo=g.maxAmmo;
  G.buff=buff;G.P.hp=maxHP();hideAll();log(`You enter the dungeon at floor ${depth}.`,'info');if(buff)log(`Your preparations: ${buffText(buff)}.`,'good');enterFloor();
  if(buff&&buff.map){G.seen.fill(1);log('Your chart shows the whole floor.','info');hud()}
}
function enterFloor(){
  const f=genFloor(G.depth,(G.buff&&G.buff.chests)||0),P=G.P;
  G.map=f.map;G.mons=f.mons;G.items=f.items;G.seen=new Array(MW*MH).fill(0);G.sealed=true;G.bl=null;G.bpal=[];ensureBlood();FX.parts=[];FX.deaths=[];
  P.x=f.x;P.y=f.y;P.dir=f.dir;P.turns=f.dir;
  for(const m of G.mons){m.vx=m.x;m.vy=m.y}
  H.deepest=Math.max(H.deepest,G.depth);
  snapCam();updateSeen();FX.fade=performance.now();save();hud();
  log(`Floor ${G.depth}. A powerful presence guards the stairs.`,'boss');
}
function descend(){G.depth++;SFX.stairs();hideAll();enterFloor()}
function completeFloor(){const g=G.P.gold,d=G.depth;H.bank+=g;const mt=bankMats();G=null;campFloor=H.waypoint;SFX.stairs();
  enterCamp(`Floor ${d} cleared! You bank ${g} gold${mt?` and ${mt} materials`:''}. New visitors have arrived at camp.`,true)}
function returnToCamp(){const g=G.P.gold;H.bank+=g;G=null;SFX.stairs();enterCamp(`You climb back to camp and bank ${g} gold.`,true)}
function die(){
  G.dead=true;SFX.die();
  const g=G.P.gold,kept=Math.floor(g/2),lostP=H.potions,lostB=H.bag.length,lostM=loseHalfMats();
  H.bank+=kept;H.potions=0;H.bag=[];H.deaths++;
  const depth=G.depth,kills=G.kills;save();
  $('deadbox').innerHTML=`<h1 style="color:#e0584a">SLAIN</h1><p>Slain on floor ${depth} after ${kills} kills.</p>
   <h3>KEPT</h3><p class="good">Level ${H.lvl}, all skills and perks, your equipped gear, all training.<br>${kept} gold was dragged back to camp.</p>
   <h3>LOST</h3><p class="bad">${g-kept} gold, ${lostP} potion${lostP===1?'':'s'}, ${lostB} pack item${lostB===1?'':'s'}${lostM?`, ${lostM} materials (half of what you carried)`:''}.</p>
   <button class="wide gold" data-cmd="camp">RETURN TO CAMP</button>`;
  updateMusic();setTimeout(()=>show('deadov'),700);
}
function endTurn(){
  const P=G.P;G.turn++;
  monstersAct();
  if(!G.dead&&G.turn%7===0&&P.hp<maxHP()&&!G.mons.some(m=>Math.abs(m.x-P.x)+Math.abs(m.y-P.y)===1))P.hp++;
  if(!G.dead&&G.turn%(isRobe(H.armor)?2:3)===0&&P.mp<maxMP())P.mp++;
  if(!G.dead&&P.regen>0){P.regen--;P.hp=Math.min(maxHP(),P.hp+(P.regenAmt||2))}
  if(!G.dead&&G.turn%2===0&&G.mons.some(m=>!m.awake&&Math.abs(m.x-P.x)+Math.abs(m.y-P.y)<=5))train('stealth',P.sneak?.8:.3);
  updateSeen();
  if(P.hp<=0&&!G.dead){P.hp=0;log('You fall, and the darkness takes you.','bad');die()}
  if(!G.dead)save();
  hud();dirty=true;
}
function log(t,c=''){if(!G)return;G.msgs.push([t,c]);if(G.msgs.length>150)G.msgs.shift();drawLog()}
function drawLog(){const L=$('log'),atBottom=L.scrollTop+L.clientHeight>=L.scrollHeight-24;
  L.innerHTML=G?G.msgs.map(([t,c],i,a)=>`<div class="${c}${i>=a.length-2?' new':''}">${t}</div>`).join('')+'<button id="logjump" data-cmd="logjump">LATEST</button>':'';
  if(atBottom||!G)L.scrollTop=L.scrollHeight;else $('logjump').style.display='block'}

// ================= ACTIONS =================
function turn(d){const P=G.P;P.turns+=d;P.dir=((P.turns%4)+4)%4;hud();dirty=true}
function tryMove(rel){
  const P=G.P,d=(P.dir+rel)%4,nx=P.x+DX[d],ny=P.y+DY[d],m=monAt(nx,ny),np=npcAt(nx,ny);
  if(np){bump(d);if(rel===0)interact(np);return}
  if(G.camp&&cell(nx,ny)===GATE){bump(d);if(rel===0)openGate();return}
  if(m){if(rel===0)attack();else{bump(d);log(`The ${mname(m)} blocks the way.`)}return}
  const t=cell(nx,ny);
  if(t===DOOR){G.map[idx(nx,ny)]=ODOOR;SFX.door();log('The door creaks open.');endTurn();return}
  if(solid(t)){bump(d);return}
  P.x=nx;P.y=ny;if(!P.sneak)SFX.step();onEnter();endTurn();if(G&&!G.dead&&P.sneak)endTurn();
}
const mname=m=>m.boss?MONS[m.t].boss:MONS[m.t].n;
function toggleSneak(){if(G.camp)return;const P=G.P;P.sneak=!P.sneak;log(P.sneak?(H.armor.at==='metal'?'You crouch, but your metal armor clanks. Sneaking is much harder in metal.':'You crouch and move silently. Each step takes two turns.'):'You stand up.',P.sneak?'info':'');hud();dirty=true}
function bump(d){FX.bump={d,t:performance.now()};SFX.bump();dirty=true}
function onEnter(){
  const P=G.P;for(const it of itemsAt(P.x,P.y)){pickup(it);G.items.splice(G.items.indexOf(it),1)}
  if(cell(P.x,P.y)===STAIRS)log(G.sealed?'A blood-red seal bars the stairs. Slay the guardian.':'The stairs lie open. Tap EXIT to return to camp.','info');
}
function pickup(it){
  const P=G.P;SFX.pick();
  if(it.k==='potion'){if(H.potions>=POTION_MAX){P.gold+=10;log('Your belt is full; you sell the potion for 10 gold.','gold')}else{H.potions++;log('You find a healing potion.','good');float('+POTION','#9ee080')}}
  else if(it.k==='gold'){const v=Math.round(it.v*goldMul());P.gold+=v;log(`You find ${v} gold.`,'gold');float('+'+v+'G','#e8c060')}
  else if(it.k==='mat')gainMat(it.m,it.n);
  else if(it.k==='ammo'){const vr=it.v||'javelin',w=[H.weapon,...H.bag].find(g=>g&&g.maxAmmo&&(g.var||'javelin')===vr&&g.ammo<g.maxAmmo);if(w){w.ammo++;log(`You retrieve a ${WVAR.thrown[vr].one} (${w.ammo}/${w.maxAmmo}).`)}}
  else if(it.k==='gear')gainGear(normGear(it.g));
  else if(it.k==='chest'){
    if(Math.random()<.45){const mt=rollMat(G.depth,['ore','hide','cloth','wood','herb','dust']);gainMat(mt.m,mt.n+1)}
    if(Math.random()<.6){log('You pry open a chest...','gold');gainGear(rollGear(G.depth))}
    else{const v=Math.round(ri(5,12)*Math.pow(G.depth,BAL.goldExp)*goldMul());P.gold+=v;if(H.potions<POTION_MAX)H.potions++;log(`The chest holds ${v} gold and a potion.`,'gold');float('+'+v+'G','#e8c060')}
  }
}
const slotOf=g=>({w:'weapon',a:'armor',s:'shield'})[g.kind];
function isUpgrade(g){const cur=H[slotOf(g)];if(!cur)return true;
  if(g.kind==='w'&&!cur.starter&&cur.wt!==g.wt)return false;
  if(g.kind==='a'&&!cur.starter&&cur.at!==g.at)return false;
  return gearVal(g)>gearVal(cur)}
function equip(g,quiet){
  const slot=slotOf(g);
  if(g.kind==='s'&&wprop(H.weapon).two){log('You cannot use a shield with a two-handed weapon.');stash(g);return false}
  if(g.kind==='w'&&wprop(g).two&&H.shield){stash(H.shield);H.shield=null;log('You sling your shield onto your pack.')}
  if(H[slot])stash(H[slot]);H[slot]=g;
  if(G)G.P.mp=Math.min(G.P.mp,maxMP()),G.P.hp=Math.min(G.P.hp,maxHP());
  if(!quiet)log(`You equip the ${g.n}.`,'good');return true}
function gainGear(g){
  const auto=isUpgrade(g)&&(g.kind!=='s'||!wprop(H.weapon).two);
  const sameKind=g.kind==='w'?(H.weapon.starter||H.weapon.wt===g.wt):g.kind==='a'?(H.armor.starter||H.armor.at===g.at):true;
  if(auto&&sameKind){equip(g,true);log(`You equip the ${g.n} (${gearDesc(g)}).`,'good');float(g.n.toUpperCase(),'#9ee080')}
  else{stash(g);log(`You stash the ${g.n}${g.rar?' ('+RARNAME[g.rar].toLowerCase()+')':''}.`,g.rar?'info':'')}
}
function stash(g){if(!g||g.starter)return;H.bag.push(g);
  if(H.bag.length>BAG_MAX){H.bag.sort((a,c)=>sellVal(c)-sellVal(a));const x=H.bag.pop();log(`Pack full; you leave the ${x.n} behind.`)}}
function lineMons(range){const P=G.P,out=[];for(let i=1;i<=range;i++){const x=P.x+DX[P.dir]*i,y=P.y+DY[P.dir]*i;if(solid(cell(x,y)))break;const m=monAt(x,y);if(m)out.push({m,d:i})}return out}
function hitCh(m,ranged){const M=MONS[m.t],wt=H.weapon.wt,W=wprop(H.weapon);
  return BAL.phit+H.lvl*.01+(disc()?.05:0)+W.hit+eff(wt)*.0025+eff(ranged?'ranged':'melee')*.0015+(ranged&&has('ranged_25')?.1:0)+(wt==='bow'&&has('bow_25')?.1:0)-(M.def+(m.boss?1:0)+(m.lv||0)*.3)*.04}
function rollDmg(m,ranged,sneak){const wt=H.weapon.wt,W=wprop(H.weapon),M=MONS[m.t];
  let d=ri(H.weapon.d[0],H.weapon.d[1])+dmgBonus()+(!ranged&&has('melee_25')?1:0);
  d*=(1+eff(wt)*.006)*(1+eff(ranged?'ranged':'melee')*.003)*(1+affSum('vicious')/100);
  if(M.undead&&wt==='blunt'&&has('blunt_25'))d*=1.5;
  if(m.boss&&wt==='spear'&&has('spear_50'))d*=1.25;
  let crit=Math.random()<.08+W.crit+affSum('keen')/100+(wt==='dagger'&&has('dagger_50')?.1:0)+(wt==='thrown'&&has('thrown_50')?.15:0);
  if(sneak){d*=sneakMul(wt);if(has('stealth_50'))crit=true}
  if(crit)d*=2;d*=1+((curBuff()||{}).dmg||0);if(!ranged){if(isGi(H.armor))d*=1.08;if(disc())d*=1.15}return{d:Math.round(d)+affSum('flame'),crit}}
function addSt(m,k,n){m.st=m.st||{};m.st[k]=Math.max(m.st[k]||0,n)}
function damageMon(m,d,crit,quiet){
  m.sleep=0;m.hp-=d;spray(m,3+Math.min(7,Math.round(d/2))+(crit?4:0),crit);m.hitT=performance.now();SFX.hit();float((crit?'CRIT ':'')+d,crit?'#ffd36a':'#ffffff');
  if(m.hp<=0){kill(m);return true}
  if(!quiet)log(`You hit the ${mname(m)} for ${d}${crit?' (critical!)':''}.`);return false}
function strike(m,ranged,mult=1){
  if(!G.mons.includes(m))return;
  const wt=H.weapon.wt,sneak=!m.awake;m.awake=true;m.sleep=0;
  train(wt,1);train(ranged?'ranged':'melee',.6);
  if(sneak||Math.random()<hitCh(m,ranged)){
    let{d,crit}=rollDmg(m,ranged,sneak);d=Math.max(1,Math.round(d*mult));
    if(sneak){log(`Sneak attack! (x${sneakMul(wt)})`,'gold');train('stealth',2)}
    const lv=affSum('leech');if(lv){G.P.hp=Math.min(maxHP(),G.P.hp+lv)}
    const dead=damageMon(m,d,crit);
    if(!dead){
      if(wt==='axe'&&has('axe_25')&&Math.random()<.3){addSt(m,'bleed',3);log(`The ${mname(m)} is bleeding.`)}
      {const Wb=wprop(H.weapon).bleed;if(Wb&&Math.random()<Wb){addSt(m,'bleed',3);log(`The ${mname(m)} is bleeding.`)}}
      {const Ws=wprop(H.weapon).stun;if(Ws&&Math.random()<Ws){addSt(m,'stun',1);log(`The ${mname(m)} is stunned!`)}}
      if(wt==='dagger'&&has('dagger_50')&&crit){addSt(m,'bleed',3)}
      if(((wt==='blunt'&&has('blunt_50'))||(wt==='martial'&&has('martial_50')))&&Math.random()<.2){addSt(m,'stun',1);log(`The ${mname(m)} is stunned!`)}
    }else{train(wt,1.5);if(has('melee_50')&&!ranged)G.P.hp=Math.min(maxHP(),G.P.hp+3)}
  }else{SFX.swing();float('MISS','#a0a0a0');log(`You miss the ${mname(m)}.`)}
}
function attack(){
  if(G.camp){const m=useMode()[2];if(m==='npc'||m==='gate')return useAction();log('No need for weapons here.');return}
  const P=G.P,wt=H.weapon.wt,W=wprop(H.weapon),ranged=!!W.range;let targets=[];
  if(wt==='thrown'&&!(H.weapon.ammo>0)){const m=monAt(P.x+DX[P.dir],P.y+DY[P.dir]);log(m?`Out of ${W.n.toLowerCase()}! You punch instead.`:`Out of ${W.n.toLowerCase()}. Go pick them up.`,'bad');
    if(m){const d=ri(1,3)+dmgBonus();train('martial',.5);damageMon(m,d,false);m.awake=true}endTurn();return}
  if(ranged){const line=lineMons(W.range+(wt==='bow'&&has('bow_25')?2:0));if(line.length)targets=(wt==='bow'&&has('bow_50'))?line:[line[0]]}
  else{const m=monAt(P.x+DX[P.dir],P.y+DY[P.dir]);if(m)targets=[{m,d:1}];else if(wt==='spear'&&has('spear_25')){const l=lineMons(2);if(l.length)targets=[l[0]]}}
  if(!targets.length){SFX.swing();log(ranged?'You loose a shot into the dark.':'You swing at empty air.');endTurn();return}
  if(ranged){FX.bolt={c:'#e8e0c8',sz:.08,t:performance.now(),d:targets[0].d};SFX.shoot()}
  if(wt==='thrown'){H.weapon.ammo--;const tm=targets[0].m;G.items.push(popItem({k:'ammo',v:H.weapon.var||'javelin',t:H.weapon.t||1,x:tm.x,y:tm.y},tm))}
  const first=targets[0].m;
  for(const t of targets)strike(t.m,ranged);
  if(wt==='sword'&&has('sword_50')&&Math.random()<.15&&G.mons.includes(first)){log('Flurry!','good');strike(first,false)}

      +optRow('Music','',`<button data-cmd="music">${musicOn?'ON':'OFF'}</button>`)+optRow('Sound effects','',`<button data-cmd="sound">${muted?'OFF':'ON'}</button>`);
  }else if(tab==='video'){
    const pre=RES.find(x=>x[0]===SET.res)||RES[1],ui=UIS.find(x=>x[0]===SET.ui)||UIS[0],lay=LAYOUTS.find(x=>x[0]===SET.layout)||LAYOUTS[0];
    h=`<h2>VIDEO</h2>`
      +optRow('Resolution',`Rendering ${RW}×${RH}. Lower is chunkier and faster; higher is sharper.`,cyc('res',pre[1]))
      +optRow('Brightness','How far your torchlight reaches.',slider('bright',60,160))
      +optRow('Interface size',`Text and buttons${SET.ui?'':` (auto: ${pct(uiScale())}%)`}.`,cyc('ui',ui[1]))
      +optRow('Layout','Portrait puts controls below; wide puts them beside the view.',cyc('layout',lay[1]))
      +optRow('Screen flashes','Red hurt flash and spell flashes.',cyc('flash',SET.flash?'ON':'OFF'))
      +(document.fullscreenEnabled?optRow('Fullscreen','Also F11 on a PC.',`<button data-cmd="fs">${document.fullscreenElement?'ON':'OFF'}</button>`):'');
  }else if(tab==='controls'){
    h=`<h2>CONTROLS</h2><div class="keys">
      <b>W / UP</b><span>Step forward</span><b>S / DOWN</b><span>Step back</span><b>A / D</b><span>Strafe left / right</span>
      <b>Q E / ARROWS</b><span>Turn left / right</span><b>SPACE</b><span>Attack</span><b>F / ENTER</b><span>Use, talk, open</span>
      <b>R</b><span>Cast readied spell</span><b>X</b><span>Sneak</span><b>C</b><span>Pick up</span><b>H</b><span>Drink potion</span>
      <b>I</b><span>Pack</span><b>K</b><span>Character sheet</span><b>M</b><span>Map</span><b>L</b><span>Log</span><b>ESC</b><span>This menu</span></div>
      <p class="dim" style="font-size:18px;text-align:left">Touch: swipe the view to move and turn (swipe left turns left), tap the view or walk into a foe to attack.</p>`;
  }
  if(tab!=='main')h+=`<button class="wide gold" data-cmd="mtab" data-t="main">BACK</button>`;
  $('menubox').innerHTML=h;
  if(!$('menuov').classList.contains('show'))show('menuov');
}
function cycleSet(k){
  const nxt=(list,cur)=>list[(list.findIndex(x=>x[0]===cur)+1)%list.length][0];
  if(k==='res')SET.res=nxt(RES,SET.res);
  else if(k==='ui')SET.ui=nxt(UIS,SET.ui);
  else if(k==='layout')SET.layout=nxt(LAYOUTS,SET.layout);
  else if(k==='flash')SET.flash=SET.flash?0:1;
  saveSet();applyVideo();openMenu(menuTab);
}
function toggleFS(){
  const done=()=>setTimeout(()=>{applyVideo();if(menuTab==='video')openMenu('video')},150);
  if(document.fullscreenElement)document.exitFullscreen().then(done).catch(()=>{});
  else document.documentElement.requestFullscreen().then(done).catch(()=>{});
}
$('menubox').addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.k;if(!k)return;
  SET[k]=e.target.value/100;const v=$('v_'+k);if(v)v.textContent=e.target.value+'%';
  if(k==='bright')dirty=true;else applyAudio();saveSet()});

// ================= BOOT =================
(function boot(){
  applyVideo();
  renderSlots();
  requestAnimationFrame(frame);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{dirty=true});
  // offline cache: lets Safari reopen the game with no server and no network
  try{
    if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
      const page=location.href.split('#')[0];
      navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready)
        .then(()=>caches.open('deepdelve-cache').then(c=>c.add(page)))
        .then(()=>{$('offline').textContent='OFFLINE READY'}).catch(()=>{});
    }
  }catch(e){}
})();
</script>
</body>
</html>
